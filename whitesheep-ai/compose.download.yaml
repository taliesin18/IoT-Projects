# One-off model provisioning only. Never include this file in `up`.
services:
  model-download:
    image: ollama/ollama:0.40.14
    profiles: [download]
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_HOST: 127.0.0.1:11434
    volumes:
      - ollama_data:/root/.ollama
    networks: [download]
    entrypoint: [/bin/sh, -c]
    command:
      - 'ollama serve & server=$$!; trap "kill $$server" EXIT; until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull qwen3.5:4b'
networks:
  download: {}
